# C2 Center — Kafka + Zookeeper Infrastructure
# Usage: docker compose up -d
# Verify: docker compose logs kafka | grep "started"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: c2_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: c2_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # IMPORTANT: Use the current LAN IP so Jetson Nano can connect
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.27:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 104857600  # 100MB max
    depends_on:
      - zookeeper
    restart: unless-stopped
